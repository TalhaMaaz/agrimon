changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Features
      labels:
        - type:feature
    - title: Fixes
      labels:
        - type:bug
    - title: Experiments and results
      labels:
        - type:experiment
    - title: Datasets
      labels:
        - type:dataset
    - title: Documentation
      labels:
        - type:docs
    - title: Maintenance
      labels:
        - type:chore
    - title: Other
      labels:
        - "*"

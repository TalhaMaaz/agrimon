name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # No `cache: pip` yet: it errors when there is no requirements.txt or
          # pyproject.toml. Re-add it when #7 creates pyproject.toml.
      - name: Install
        if: hashFiles('pyproject.toml') != ''
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        if: hashFiles('pyproject.toml') != ''
        run: ruff check .
      - name: Format check
        if: hashFiles('pyproject.toml') != ''
        run: ruff format --check .
      - name: Unit tests
        if: hashFiles('pyproject.toml') != ''
        run: pytest tests/unit -q --maxfail=5
      - name: Contract tests
        if: hashFiles('pyproject.toml') != ''
        run: pytest tests/contracts -q
      - name: Hook tests
        # Standard library only, so it runs before pyproject.toml exists.
        run: python .claude/hooks/test_guard_bash.py
      - name: Block large files
        run: |
          big=$(git ls-files -z | xargs -0 -I{} sh -c 'test -f "{}" && stat -c "%s {}" "{}"' | awk '$1 > 5000000 {print}')
          if [ -n "$big" ]; then echo "$big"; exit 1; fi
      - name: Block data and secrets
        run: |
          if git ls-files | grep -E '(^data/|\.env$|\.tif$|\.tiff$|\.pt$|\.pth$|\.ckpt$)'; then exit 1; fi

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - type:chore
      - module:infra
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    labels:
      - type:chore
      - module:infra
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - type:chore
      - module:infra
